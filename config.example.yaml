job:
  project_name: colombia_spectral_indices_example

runtime:
  process_folder: /drive_mount/force_co/indices
  force_ard_dir: /opb_mount/force_col_data/colombia_sentinel2_snapshot_2025_01_23/level2
  force_grid_epsg: 9377
  force_image: davidfrantz/force:3.10.04@sha256:5e744754d2c8b23060aa520c45c775b0e135667f3e4fb6d1c64de328b722c6d5
  docker_cmd: docker
  mounts:
    - /drive_mount:/drive_mount
    - /opb_mount:/opb_mount

processing:
  mode: UDF
  execute: true
  mosaic: true
  hold: false

inputs:
  aois:
    - /drive_mount/force_co/FORCE/aoi/one_tile_X0034_Y0036.geojson

parameters:
  DATE_RANGE: 2025-01-18 2025-01-27
  DOY_RANGE: 1 365
  SENSORS: SEN2A SEN2B SEN2C
  TARGET_SENSOR: SEN2L
  SPECTRAL_ADJUST: false
  RESOLUTION: 10
  INDICES: [NDVI, EVI, NBR, NDMI]
  STATISTICS: [MEDIAN, P25, P75, VALID_COUNT]
  FILE_PYTHON: utils/templates/colombia_spectral_indices.py
  PYTHON_TYPE: CHUNK
  SCREEN_QAI: >-
    NODATA CLOUD_OPAQUE CLOUD_BUFFER CLOUD_CIRRUS CLOUD_SHADOW SNOW
    SUBZERO SATURATION
  STREAMING: false
  OUTPUT_SUBFOLDERS: true
  CHUNK_SIZE: 6000 6000
  ABOVE_NOISE: 3
  BELOW_NOISE: 1
  NTHREAD_READ: 2
  NTHREAD_COMPUTE: 2
  NTHREAD_WRITE: 2

quality_validation:
  enabled: true
  minimum_valid_coverage_pct: 95
  minimum_reliable_coverage_pct: 80
  minimum_reliable_observations: 3
  fail_on_threshold: false

mosaic_output:
  compression: ZSTD
  interleave: BAND
  zstd_level: 15
  block_size: 512
  predictor: 2
  build_overviews: true
  overview_resampling: average
  overview_levels: [2, 4, 8, 16, 32, 64, 128]
